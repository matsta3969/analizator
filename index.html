<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Analizator Meczów">
<title>Analizator Meczów</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: #161920; border-bottom: 1px solid #2a2d3a; padding: 11px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.topbar h1 { font-size: 0.98em; color: #fff; flex: 1; }
.spinner { width: 14px; height: 14px; border: 2px solid #333; border-top-color: #5aacf5; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
.spinner.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { font-size: 0.72em; color: #555; }
.search-bar { padding: 10px 12px; background: #161920; border-bottom: 1px solid #2a2d3a; display: flex; gap: 8px; flex-shrink: 0; }
.search-bar input { flex: 1; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 10px; padding: 10px 13px; color: #e0e0e0; font-size: 0.88em; outline: none; }
.search-bar input:focus { border-color: #3a6abf; }
.search-bar input::placeholder { color: #444; }
.btn-analyze { background: #2a5abf; color: #fff; border: none; border-radius: 10px; padding: 10px 15px; font-size: 0.85em; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-analyze:active { background: #1a4aaf; }
.btn-analyze:disabled { background: #333; color: #666; }
.tabs { display: flex; background: #161920; border-bottom: 1px solid #2a2d3a; flex-shrink: 0; }
.tab { flex: 1; padding: 10px 6px; text-align: center; font-size: 0.8em; color: #555; cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; justify-content: center; gap: 4px; }
.tab.active { color: #5aacf5; border-bottom-color: #5aacf5; }
.panel { flex: 1; overflow-y: auto; display: none; padding: 12px; }
.panel.active { display: block; }
.chat-panel { flex: 1; overflow: hidden; display: none; flex-direction: column; }
.chat-panel.active { display: flex; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: 0.86em; line-height: 1.5; }
.msg.bot { background: #1e2130; color: #ddd; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.user { background: #2a5abf; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.bot strong { color: #5aacf5; }
.msg.thinking { color: #555; font-style: italic; }
.quick-qs { padding: 6px 12px 8px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.quick-qs::-webkit-scrollbar { display: none; }
.qq { background: #1e2130; border: 1px solid #2a2d3a; border-radius: 14px; padding: 5px 11px; font-size: 0.74em; color: #aaa; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.qq:active { background: #2a3a5a; }
.chat-inp { padding: 10px 12px; border-top: 1px solid #2a2d3a; display: flex; gap: 8px; flex-shrink: 0; background: #161920; }
.chat-inp input { flex: 1; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 10px; padding: 10px 13px; color: #e0e0e0; font-size: 0.86em; outline: none; }
.chat-inp input:focus { border-color: #3a6abf; }
.chat-inp input::placeholder { color: #444; }
.btn-send { background: #2a5abf; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 0.95em; cursor: pointer; }
.btn-send:active { background: #1a4aaf; }
.btn-send:disabled { background: #333; color: #666; }
.card { background: #161920; border: 1px solid #2a2d3a; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 1.08em; color: #fff; margin-bottom: 3px; }
.card-meta { font-size: 0.76em; color: #555; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.live-badge { background: #0d2a0d; border: 1px solid #1a5a1a; color: #2ecc71; font-size: 0.72em; padding: 2px 6px; border-radius: 8px; }
.chances-row { display: flex; gap: 8px; margin-bottom: 12px; }
.cbox { flex: 1; background: #0f1117; border-radius: 10px; padding: 11px 6px; text-align: center; border: 1px solid #2a2d3a; }
.cbox .clabel { font-size: 0.68em; color: #666; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbox .cpct { font-size: 1.35em; font-weight: bold; }
.cbox .cbar-w { background: #2a2d3a; border-radius: 4px; height: 4px; margin-top: 6px; overflow: hidden; }
.cbox .cbar { height: 4px; border-radius: 4px; }
.c1 .cpct { color: #5aacf5; } .c1 .cbar { background: #5aacf5; }
.cx .cpct { color: #f5c34a; } .cx .cbar { background: #f5c34a; }
.c2 .cpct { color: #f5614a; } .c2 .cbar { background: #f5614a; }
.verdict { background: #0d1f14; border: 1px solid #1e5c2a; border-radius: 10px; padding: 13px 15px; margin-bottom: 12px; }
.verdict .vl { font-size: 0.72em; color: #2ecc71; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.verdict .vtip { font-size: 0.98em; font-weight: bold; color: #fff; margin-bottom: 4px; }
.verdict .vsub { font-size: 0.78em; color: #aaa; line-height: 1.7; }
.ibox { background: #0f1117; border: 1px solid #2a2d3a; border-radius: 10px; padding: 13px; margin-bottom: 10px; }
.ibox h3 { font-size: 0.73em; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 9px; }
.irow { display: flex; justify-content: space-between; font-size: 0.82em; padding: 4px 0; border-bottom: 1px solid #1e2130; }
.irow:last-child { border-bottom: none; }
.ik { color: #666; } .iv { color: #fff; font-weight: 500; }
.iv.r { color: #e74c3c; } .iv.g { color: #2ecc71; } .iv.y { color: #f39c12; }
.form-dots { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.fd { width: 25px; height: 25px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size:0.7em; font-weight:bold; }
.fw { background:#27ae60; color:#fff; } .fdraw { background:#f39c12; color:#fff; } .fl { background:#e74c3c; color:#fff; } .fq { background:#333; color:#666; }
.odds-grid { display: flex; gap: 8px; margin-bottom: 12px; }
.ocell { flex: 1; background: #161920; border: 1px solid #2a2d3a; border-radius: 8px; padding: 9px 5px; text-align: center; }
.ocell .ol { font-size: 0.66em; color: #666; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ocell .ov { font-size: 1.1em; font-weight: bold; color: #fff; }
.ocell .os { font-size: 0.66em; color: #555; margin-top: 2px; }
.sts-inputs { display: flex; gap: 7px; margin-bottom: 10px; }
.sig { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.sig label { font-size: 0.66em; color: #666; text-align: center; }
.sig input { background: #0f1117; border: 1px solid #2a2d3a; border-radius: 8px; padding: 8px 5px; color: #fff; font-size: 0.85em; text-align: center; outline: none; width: 100%; }
.sig input:focus { border-color: #3a6abf; }
.btn-value { width: 100%; background: #2a5abf; color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 0.86em; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
.btn-value:active { background: #1a4aaf; }
.vres { border-radius: 8px; padding: 11px; font-size: 0.82em; line-height: 1.6; display: none; }
.vres.vb { background: #0d1f14; border: 1px solid #1e5c2a; color: #2ecc71; }
.vres.nv { background: #1f0d0d; border: 1px solid #5c1e1e; color: #e74c3c; }
.vres.nt { background: #1a1a0d; border: 1px solid #5c5c1e; color: #f39c12; }
.placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 20px; color: #333; gap: 12px; text-align: center; }
.placeholder .ico { font-size: 3.2em; }
.hi-item { background: #161920; border: 1px solid #2a2d3a; border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer; }
.hi-item:active { background: #1e2640; }
.hi-teams { font-size: 0.9em; font-weight: 600; color: #fff; margin-bottom: 3px; }
.hi-league { font-size: 0.73em; color: #555; margin-bottom: 7px; }
.hi-odds { display: flex; gap: 5px; }
.hp { flex: 1; text-align: center; font-size: 0.7em; padding: 3px 0; border-radius: 5px; font-weight: bold; }
.hp1 { background: #1a3a5a; color: #5aacf5; } .hpx { background: #3a2e10; color: #f5c34a; } .hp2 { background: #3a1a1a; color: #f5614a; }
.loader { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 20px; color: #555; }
.lspin { width: 28px; height: 28px; border: 3px solid #333; border-top-color: #5aacf5; border-radius: 50%; animation: spin 0.8s linear infinite; }
.lstep { font-size: 0.82em; color: #444; padding: 3px 0; }
.lstep.done { color: #2ecc71; }
.lstep.active { color: #5aacf5; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div style="font-size:1.25em">⚽</div>
  <h1>Analizator Meczów</h1>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="statusBar">Gotowy</div>
</div>

<div class="search-bar">
  <input type="text" id="matchInput" placeholder="np. Barcelona vs Alaves, La Liga"
    onkeydown="if(event.key==='Enter'){this.blur();analyzeMatch();}" />
  <button class="btn-analyze" id="btnAnalyze" onclick="analyzeMatch()">🔍</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('analysis')" id="tab-analysis"><span>📊</span> Analiza</div>
  <div class="tab" onclick="switchTab('chat')" id="tab-chat"><span>💬</span> Czat AI</div>
  <div class="tab" onclick="switchTab('history')" id="tab-history"><span>🕐</span> Historia</div>
</div>

<div class="panel active" id="panel-analysis">
  <div class="placeholder" id="placeholder">
    <div class="ico">⚽</div>
    <p>Wpisz mecz i kliknij 🔍</p>
    <p style="color:#2a2d3a;font-size:0.8em">Pobieram dane z internetu + AI</p>
  </div>
  <div id="analysisContent" style="display:none"></div>
</div>

<div class="chat-panel" id="panel-chat">
  <div class="chat-msgs" id="chatMsgs">
    <div class="msg bot">Cześć! 👋<br><br>Wpisz mecz → <strong>szukam danych w internecie</strong> → analizuję i typuję.<br><br>Wpisz mecz i kliknij 🔍!</div>
  </div>
  <div class="quick-qs">
    <div class="qq" onclick="sq('Jaki jest twój typ?')">🎯 Typ</div>
    <div class="qq" onclick="sq('Jakie są kontuzje?')">🏥 Kontuzje</div>
    <div class="qq" onclick="sq('Jaka jest forma?')">📈 Forma</div>
    <div class="qq" onclick="sq('Ile bramek padnie?')">⚽ Bramki</div>
    <div class="qq" onclick="sq('Historia H2H?')">📊 H2H</div>
    <div class="qq" onclick="sq('Czy warto obstawiać?')">💰 Value?</div>
    <div class="qq" onclick="sq('Jakie są składy?')">👕 Składy</div>
  </div>
  <div class="chat-inp">
    <input type="text" id="chatInput" placeholder="Zadaj pytanie..."
      onkeydown="if(event.key==='Enter'){this.blur();sendChat();}" />
    <button class="btn-send" id="btnSend" onclick="sendChat()">➤</button>
  </div>
</div>

<div class="panel" id="panel-history">
  <div id="historyContent">
    <div class="placeholder"><div class="ico">🕐</div><p>Brak historii analiz.</p></div>
  </div>
</div>

<script>
const GROQ_KEY   = localStorage.getItem("GROQ_KEY") || "";
const GROQ_MODEL = "openai/gpt-oss-20b";
const GROQ_URL   = "https://api.groq.com/openai/v1/chat/completions";
const TAVILY_KEY = localStorage.getItem("TAVILY_KEY") || "";
const TAVILY_URL = "https://api.tavily.com/search";

let currentMatch = null;
let analysisHistory = [];
let chatHistory = [];
let searchContext = "";

function switchTab(name) {
  ["analysis","chat","history"].forEach(t => {
    document.getElementById("tab-"+t).classList.toggle("active", t===name);
    const el = document.getElementById("panel-"+t);
    if (t==="chat") { el.style.display=(t===name)?"flex":"none"; el.classList.toggle("active",t===name); }
    else el.classList.toggle("active", t===name);
  });
  if (name==="chat") { const m=document.getElementById("chatMsgs"); m.scrollTop=m.scrollHeight; }
}

async function tavilySearch(query) {
  const res = await fetch(TAVILY_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      api_key: TAVILY_KEY,
      query,
      search_depth: "advanced",
      max_results: 5,
      include_answer: true,
      include_domains: ["flashscore.com","flashscore.pl","bbc.com","skysports.com",
        "transfermarkt.com","sofascore.com","fotmob.com","espn.com","goal.com",
        "meczyki.pl","sportowefakty.wp.pl"]
    })
  });
  if (!res.ok) throw new Error("Tavily " + res.status);
  return await res.json();
}

async function gatherMatchData(home, away, league) {
  const queries = [
    `${home} vs ${away} ${league} 2026 form table standings statistics`,
    `${home} ${away} injuries squad news ${league} 2026`,
    `${home} vs ${away} head to head h2h history`,
    `${home} ${away} prediction analysis ${league}`,
  ];
  const results = [];
  for (const q of queries) {
    try {
      const data = await tavilySearch(q);
      if (data.results) results.push(...data.results.map(r=>r.content).filter(Boolean));
      if (data.answer) results.push(data.answer);
    } catch(e) {}
  }
  return results.join("\n\n---\n\n").slice(0, 12000);
}

async function callGroq(sys, usr, hist=[]) {
  const messages = [{role:"system",content:sys},...hist,{role:"user",content:usr}];
  const res = await fetch(GROQ_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},
    body:JSON.stringify({model:GROQ_MODEL,messages,temperature:0.5,max_tokens:2048})
  });
  if (!res.ok) { const e=await res.json(); throw new Error(e.error?.message||"Groq błąd"); }
  return (await res.json()).choices[0].message.content;
}

async function analyzeMatch() {
  const input = document.getElementById("matchInput").value.trim();
  if (!input) return;
  setLoading(true); showLoader();
  const parts = input.split(",");
  const vsParts = parts[0].trim().split(/\s+vs\.?\s+/i);
  const home = vsParts[0]?.trim()||parts[0].trim();
  const away = vsParts[1]?.trim()||"?";
  const league = parts[1]?.trim()||"";
  try {
    setStatus("Szukam w internecie...");
    updateStep(1);
    searchContext = await gatherMatchData(home, away, league);
    setStatus("Analizuję z AI...");
    updateStep(2);

    const sys = `Jesteś ekspertem od analizy meczów i typowania. Odpowiadasz po polsku. Zwróć TYLKO JSON:
{"home":"${home}","away":"${away}","league":"${league||"Liga"}","home_pct":liczba,"draw_pct":liczba,"away_pct":liczba,"predicted_score":"2-1","tip":"typowanie","risk":"NISKIE/SREDNIE/WYSOKIE","confidence":liczba1-10,"home_form":["W","D","L","W","W"],"away_form":["L","W","D","L","W"],"home_position":"1. miejsce","home_points":"27 pkt","home_goals_for":"40","home_goals_against":"11","home_streak":"seria","away_position":"8. miejsce","away_points":"14 pkt","away_goals_for":"12","away_goals_against":"15","away_streak":"seria","injuries_home":"lista lub Brak","injuries_away":"lista lub Brak","h2h":"historia 3-4 zdania","key_facts":["fakt1","fakt2","fakt3"],"analysis":"analiza 5 zdań","btts":"TAK/NIE","over25":"TAK/NIE","over35":"TAK/NIE","best_bet":"najlepszy zakład z uzasadnieniem"}

DANE Z INTERNETU:\n` + searchContext;

    const response = await callGroq(sys, `Przeanalizuj: ${home} vs ${away} ${league}`);
    const jm = response.match(/\{[\s\S]*\}/);
    if (!jm) throw new Error("Błąd parsowania AI");
    const data = JSON.parse(jm[0]);
    data.searchContext = searchContext;
    currentMatch = data;
    analysisHistory.unshift(data);
    updateHistory();
    displayAnalysis(data);
    chatHistory = [];
    document.getElementById("chatMsgs").innerHTML = "";
    addBotMsg("✅ Gotowe! Zebrałem dane z internetu.\n\n🎯 **"+data.tip+"**\n\nPewność: **"+data.confidence+"/10** · Ryzyko: **"+data.risk+"**");
    switchTab("analysis");
  } catch(err) {
    document.getElementById("placeholder").style.display="flex";
    document.getElementById("analysisContent").style.display="none";
    addBotMsg("Błąd: "+err.message);
    switchTab("chat");
  }
  setLoading(false);
}

function displayAnalysis(d) {
  document.getElementById("placeholder").style.display="none";
  const content = document.getElementById("analysisContent");
  content.style.display="block";
  const rC = d.risk==="NISKIE"?"#2ecc71":d.risk==="SREDNIE"?"#f39c12":"#e74c3c";
  const cC = d.confidence>=7?"#2ecc71":d.confidence>=5?"#f39c12":"#e74c3c";
  const fd = (form) => (form||[]).map(f=>`<div class="fd ${{W:"fw",D:"fdraw",L:"fl"}[f]||"fq"}">${f}</div>`).join("");

  let html = "";

  html += `<div class="card"><h2>${d.home} vs ${d.away}</h2>
  <div class="card-meta"><span>${d.league||""}</span><span class="live-badge">✓ Dane live</span></div>
  <div class="chances-row">
    <div class="cbox c1"><div class="clabel">${d.home}</div><div class="cpct">${d.home_pct}%</div><div class="cbar-w"><div class="cbar" style="width:${d.home_pct}%"></div></div></div>
    <div class="cbox cx"><div class="clabel">Remis</div><div class="cpct">${d.draw_pct}%</div><div class="cbar-w"><div class="cbar" style="width:${d.draw_pct}%"></div></div></div>
    <div class="cbox c2"><div class="clabel">${d.away}</div><div class="cpct">${d.away_pct}%</div><div class="cbar-w"><div class="cbar" style="width:${d.away_pct}%"></div></div></div>
  </div></div>`;

  html += `<div class="verdict"><div class="vl">🎯 Werdykt</div><div class="vtip">${d.tip}</div>
  <div class="vsub">Wynik: <strong>${d.predicted_score}</strong> · Obie: <strong>${d.btts}</strong> · Over 2.5: <strong>${d.over25}</strong> · Over 3.5: <strong>${d.over35}</strong><br>
  Ryzyko: <strong style="color:${rC}">${d.risk}</strong> · Pewność: <strong style="color:${cC}">${d.confidence}/10</strong></div></div>`;

  if (d.best_bet) html += `<div class="ibox" style="background:#0d1a2a;border-color:#1a4a6a;margin-bottom:10px"><h3 style="color:#5aacf5">💡 Najlepszy zakład</h3><div style="font-size:0.83em;color:#bbb;line-height:1.6">${d.best_bet}</div></div>`;

  html += `<div class="ibox"><h3>💰 Kursy sprawiedliwe vs STS</h3>
  <div class="odds-grid">
    <div class="ocell"><div class="ol">1—${d.home}</div><div class="ov">${p2o(d.home_pct)}</div><div class="os">${d.home_pct}%</div></div>
    <div class="ocell"><div class="ol">X—Remis</div><div class="ov">${p2o(d.draw_pct)}</div><div class="os">${d.draw_pct}%</div></div>
    <div class="ocell"><div class="ol">2—${d.away}</div><div class="ov">${p2o(d.away_pct)}</div><div class="os">${d.away_pct}%</div></div>
  </div>
  <h3 style="font-size:0.73em;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:9px">🔍 Sprawdź Value Bet</h3>
  <div class="sts-inputs">
    <div class="sig"><label>Kurs 1</label><input type="number" id="sts1" placeholder="2.10" step="0.01" min="1" inputmode="decimal"></div>
    <div class="sig"><label>Kurs X</label><input type="number" id="stsX" placeholder="3.40" step="0.01" min="1" inputmode="decimal"></div>
    <div class="sig"><label>Kurs 2</label><input type="number" id="sts2" placeholder="3.20" step="0.01" min="1" inputmode="decimal"></div>
  </div>
  <button class="btn-value" onclick="checkValue(${d.home_pct},${d.draw_pct},${d.away_pct})">Sprawdź Value Bet</button>
  <div class="vres" id="vres"></div></div>`;

  if (d.key_facts?.length) html += `<div class="ibox"><h3>⚡ Kluczowe fakty</h3>${d.key_facts.map(f=>`<div style="font-size:0.82em;color:#bbb;padding:4px 0;border-bottom:1px solid #1e2130">• ${f}</div>`).join("")}</div>`;

  html += `<div class="ibox"><h3>📊 ${d.home}</h3>
  <div class="irow"><span class="ik">Pozycja</span><span class="iv">${d.home_position||"?"}</span></div>
  <div class="irow"><span class="ik">Punkty</span><span class="iv">${d.home_points||"?"}</span></div>
  <div class="irow"><span class="ik">Strzelone</span><span class="iv g">${d.home_goals_for||"?"}</span></div>
  <div class="irow"><span class="ik">Stracone</span><span class="iv r">${d.home_goals_against||"?"}</span></div>
  <div class="irow"><span class="ik">Seria</span><span class="iv y">${d.home_streak||"?"}</span></div>
  <div style="font-size:0.7em;color:#555;margin-top:7px">Forma:</div>
  <div class="form-dots">${fd(d.home_form)}</div></div>`;

  html += `<div class="ibox"><h3>📊 ${d.away}</h3>
  <div class="irow"><span class="ik">Pozycja</span><span class="iv">${d.away_position||"?"}</span></div>
  <div class="irow"><span class="ik">Punkty</span><span class="iv">${d.away_points||"?"}</span></div>
  <div class="irow"><span class="ik">Strzelone</span><span class="iv g">${d.away_goals_for||"?"}</span></div>
  <div class="irow"><span class="ik">Stracone</span><span class="iv r">${d.away_goals_against||"?"}</span></div>
  <div class="irow"><span class="ik">Seria</span><span class="iv y">${d.away_streak||"?"}</span></div>
  <div style="font-size:0.7em;color:#555;margin-top:7px">Forma:</div>
  <div class="form-dots">${fd(d.away_form)}</div></div>`;

  html += `<div class="ibox"><h3>🏥 Kontuzje — ${d.home}</h3><div style="font-size:0.82em;color:#aaa;line-height:1.6">${d.injuries_home||"Brak"}</div></div>`;
  html += `<div class="ibox"><h3>🏥 Kontuzje — ${d.away}</h3><div style="font-size:0.82em;color:#aaa;line-height:1.6">${d.injuries_away||"Brak"}</div></div>`;
  html += `<div class="ibox"><h3>⚔️ H2H</h3><div style="font-size:0.83em;color:#bbb;line-height:1.7">${d.h2h||"Brak"}</div></div>`;
  html += `<div class="ibox"><h3>📝 Analiza</h3><div style="font-size:0.83em;color:#bbb;line-height:1.7">${d.analysis||"Brak"}</div></div>`;

  content.innerHTML = html;
}

function p2o(pct) { return pct>0?(1/(pct/100)).toFixed(2):"-"; }

function checkValue(p1,px,p2) {
  const s1=parseFloat(document.getElementById("sts1").value);
  const sX=parseFloat(document.getElementById("stsX").value);
  const s2=parseFloat(document.getElementById("sts2").value);
  const el=document.getElementById("vres");
  if (isNaN(s1)&&isNaN(sX)&&isNaN(s2)) { el.style.display="block"; el.className="vres nt"; el.innerHTML="⚠️ Wpisz przynajmniej jeden kurs."; return; }
  const cs=[{l:"1 (gospod.)",s:s1,f:1/(p1/100)},{l:"X (remis)",s:sX,f:1/(px/100)},{l:"2 (gość)",s:s2,f:1/(p2/100)}];
  let lines=[]; let best=null; let bd=0;
  for (const c of cs) {
    if (isNaN(c.s)) continue;
    const d=((c.s-c.f)/c.f*100).toFixed(1); const iv=c.s>c.f;
    lines.push(`${iv?"✅":"❌"} <strong>${c.l}</strong>: ${c.s} vs ${c.f.toFixed(2)} → <span style="color:${iv?"#2ecc71":"#e74c3c"}">${iv?"VALUE +":""}${d}%</span>`);
    if (iv&&parseFloat(d)>bd) { bd=parseFloat(d); best=c.l; }
  }
  el.style.display="block";
  if (best) { el.className="vres vb"; el.innerHTML=`<strong>🎯 VALUE BET!</strong><br><br>${lines.join("<br>")}<br><br><strong>Najlepszy: ${best} (+${bd.toFixed(1)}%)</strong>`; }
  else { el.className="vres nv"; el.innerHTML=`<strong>⛔ Brak Value Bet</strong><br><br>${lines.join("<br>")}<br><br><span style="color:#aaa">Kursy poniżej wartości.</span>`; }
}

async function sendChat() {
  const inp=document.getElementById("chatInput"); const msg=inp.value.trim();
  if (!msg) return; inp.value=""; addUserMsg(msg); document.getElementById("btnSend").disabled=true;
  const thinking=addBotMsg("...","thinking");
  const ctx=currentMatch?`Mecz: ${currentMatch.home} vs ${currentMatch.away}. Typ: ${currentMatch.tip}. Analiza: ${currentMatch.analysis}. Dane: ${(currentMatch.searchContext||"").slice(0,2000)}`:"Brak meczu.";
  try {
    chatHistory.push({role:"user",content:msg});
    const r=await callGroq("Ekspert piłkarski. Odpowiadasz po polsku, konkretnie (max 4 zdania). Kontekst: "+ctx, msg, chatHistory.slice(-6));
    chatHistory.push({role:"assistant",content:r});
    thinking.remove(); addBotMsg(r);
  } catch(e) { thinking.remove(); addBotMsg("Błąd. Spróbuj ponownie."); }
  document.getElementById("btnSend").disabled=false;
}

function sq(q) { document.getElementById("chatInput").value=q; switchTab("chat"); sendChat(); }

function updateHistory() {
  const el=document.getElementById("historyContent");
  if (!analysisHistory.length) { el.innerHTML="<div class='placeholder'><div class='ico'>🕐</div><p>Brak historii.</p></div>"; return; }
  el.innerHTML=analysisHistory.map((m,i)=>`<div class="hi-item" onclick="loadHistory(${i})"><div class="hi-teams">${m.home} vs ${m.away}</div><div class="hi-league">${m.league||""} · pewność ${m.confidence}/10</div><div class="hi-odds"><div class="hp hp1">1: ${m.home_pct}%</div><div class="hp hpx">X: ${m.draw_pct}%</div><div class="hp hp2">2: ${m.away_pct}%</div></div></div>`).join("");
}

function loadHistory(i) { currentMatch=analysisHistory[i]; displayAnalysis(currentMatch); switchTab("analysis"); }

let loaderStepsM = [];
function showLoader() {
  loaderStepsM = ["Szukam danych w internecie...","Zbieram formę, tabelę, kontuzje...","AI analizuje i typuje..."];
  document.getElementById("placeholder").style.display="none";
  const c=document.getElementById("analysisContent"); c.style.display="block";
  c.innerHTML=`<div class="loader"><div class="lspin"></div><div>${loaderStepsM.map((s,i)=>`<div class="lstep ${i===0?"active":""}" id="ms${i}">○ ${s}</div>`).join("")}</div></div>`;
}
function updateStep(idx) {
  const prev=document.getElementById("ms"+(idx-1));
  const curr=document.getElementById("ms"+idx);
  if (prev) { prev.className="lstep done"; prev.innerHTML="✓ "+loaderStepsM[idx-1]; }
  if (curr) { curr.className="lstep active"; }
}

function setLoading(on) {
  document.getElementById("btnAnalyze").disabled=on;
  document.getElementById("btnAnalyze").textContent=on?"⏳":"🔍";
  document.getElementById("spinner").classList.toggle("on",on);
  setStatus(on?"Analizuję...":"Gotowy");
}
function setStatus(msg) { document.getElementById("statusBar").textContent=msg; }
function addBotMsg(text,cls="") {
  const msgs=document.getElementById("chatMsgs"); const div=document.createElement("div");
  div.className="msg bot"+(cls?" "+cls:"");
  div.innerHTML=text.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
  msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight; return div;
}
function addUserMsg(text) {
  const msgs=document.getElementById("chatMsgs"); const div=document.createElement("div");
  div.className="msg user"; div.textContent=text; msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight;
}

// START
switchTab("analysis");
if (!localStorage.getItem("GROQ_KEY") || !localStorage.getItem("TAVILY_KEY")) {
  showSetup();
}
